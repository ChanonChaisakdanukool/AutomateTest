<script type="module">

const webLocalized=__WEB_LOCALIZED__;
const token='__TOKEN__';const $=id=>document.getElementById(id);let config={},catalog=[],schemas={},loaded=false,pending=false,ready=false,running=false,appiumState="offline",dragIndex=null;

function setTheme(dark){

 const report=$('reportFrame').contentDocument;if(report)report.documentElement.dataset.theme=dark?'dark':'light';

}
setTheme(localStorage.getItem('theme')==='dark');
$('themeToggle').onclick=()=>{
 const dark=document.documentElement.dataset.theme!=='dark';
 setTheme(dark);localStorage.setItem('theme',dark?'dark':'light');
};
// Move the existing log node so polling, selection and scroll continue while expanded.
let expandedLog=null;
const logDialog=$('logDialog');
document.querySelectorAll('[data-expand-log]').forEach(button=>button.onclick=()=>{
  const log=$(button.dataset.expandLog);
  expandedLog={log,parent:log.parentNode,next:log.nextSibling,scrollTop:log.scrollTop,scrollLeft:log.scrollLeft};
  $('expandedLogTitle').textContent=$(log.id+'Title').textContent;
  $('expandedLogBody').append(log);
  logDialog.showModal();
  log.scrollTop=expandedLog.scrollTop;log.scrollLeft=expandedLog.scrollLeft;
});
$('closeLog').onclick=()=>logDialog.close();
logDialog.addEventListener('close',()=>{
  if(!expandedLog)return;
  const {log,parent,next}=expandedLog;const top=log.scrollTop,left=log.scrollLeft;
  parent.insertBefore(log,next);log.scrollTop=top;log.scrollLeft=left;expandedLog=null;
});

let deviceDrafts={},devicePlatform=null,deviceLoading=false,deviceRequest=0,resultSignature='';
const platformValue=()=>document.querySelector('input[name=platform]:checked')?.value;
async function api(path,method='GET',data){
 const response=await fetch('/api/'+path,{method,signal:AbortSignal.timeout(path==='appium/stop'?20000:10000),headers:{'X-Dashboard-Token':token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});

 const result=await response.json();if(!response.ok)throw Error(result.error);return result;
}
function notice(text){$('notice').textContent=text;}
function controls(){ $('start').disabled=!loaded||pending||running||!ready||!connected||deviceLoading||!devicePlatform;$('fields').disabled=!loaded||pending||running;$('appiumStart').disabled=!connected||pending||appiumState==='stopping';$('appiumStart').textContent=appiumState==='stopping'?webLocalized.stoppingButton:(appiumState!=='offline'||running)?webLocalized.closeAppium:webLocalized.openAppium;$('deviceFields').disabled=deviceLoading||!devicePlatform||pending||running; }

function move(from,to){if(running||pending||from===to)return;config=collect();const [entry]=config.testCases.splice(from,1);config.testCases.splice(to,0,entry);draw();}
function additionalFields(value,parent,key,labelText){
 const wrap=document.createElement('div');
 if(value!==null&&typeof value==='object'){
  const title=document.createElement('h4');title.textContent=labelText;wrap.append(title);
  for(const child of Object.keys(value))wrap.append(additionalFields(value[child],value,child,child));
  if(!Object.keys(value).length){const hint=document.createElement('small');hint.textContent=webLocalized.emptyFields;wrap.append(hint);}
  return wrap;
 }
 const label=document.createElement('label');label.textContent=labelText;
 const input=document.createElement(typeof value==='boolean'?'select':'input');
 if(typeof value==='boolean'){for(const v of ['true','false']){const option=document.createElement('option');option.value=v;option.textContent=v;input.append(option);}input.value=String(value);}
 else {input.type=typeof value==='number'?'number':'text';if(input.type==='number')input.step='any';input.value=value??'';if(value===null){input.disabled=true;input.placeholder=webLocalized.nullField;}}
 input.oninput=()=>{if(typeof value==='boolean')parent[key]=input.value==='true';else if(typeof value==='number'){input.setCustomValidity(input.value===''||!Number.isFinite(Number(input.value))?webLocalized.numberRequired:'');if(input.checkValidity())parent[key]=Number(input.value);}else parent[key]=input.value;};
 label.append(input);wrap.append(label);return wrap;
}
function draw(){
 for(const key of ['runName'])$(key).value=config[key]??'';
 document.querySelectorAll('input[name=platform]').forEach(input=>input.checked=input.value===config.platform);
 $('continueOnFail').checked=config.shouldContinueNextCaseWhenFail??true;
 const list=$('cases');list.replaceChildren();
 const columns=document.createElement('div');columns.className='case-columns';
 for(const text of [webLocalized.caseColumn,webLocalized.dataColumn,webLocalized.actionsColumn]){
  const cell=document.createElement('span');cell.textContent=text;columns.append(cell);
 }
 list.append(columns);
 (config.testCases??[]).forEach((entry,index)=>{
  const row=document.createElement('div');row.className='case-card';row.dataset.index=index;
  const header=document.createElement('div');header.className='case';
  const handle=document.createElement('button');handle.className='secondary drag-handle';handle.textContent='⠿';handle.title=webLocalized.drag;handle.setAttribute('aria-label',webLocalized.dragCase+(index+1));handle.draggable=true;
  handle.ondragstart=event=>{if(running||pending){event.preventDefault();return;}dragIndex=index;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(index));row.classList.add('dragging');};
  handle.ondragend=()=>{dragIndex=null;document.querySelectorAll('.case-card').forEach(el=>el.classList.remove('drop-target','dragging'));};
  row.ondragover=event=>{if(dragIndex===null||running||pending)return;event.preventDefault();event.dataTransfer.dropEffect='move';row.classList.add('drop-target');};
  row.ondragleave=()=>row.classList.remove('drop-target');
  row.ondrop=event=>{event.preventDefault();if(dragIndex!==null)move(dragIndex,index);dragIndex=null;};
  header.append(handle);const label=document.createElement('span');label.textContent=(index+1)+'. '+entry.case.id;header.append(label);
  for(const [text,offset]of [['↑',-1],['↓',1],[webLocalized.delete,0]]){const button=document.createElement('button');button.className='secondary';button.textContent=text;button.setAttribute('aria-label',text+webLocalized.caseSuffix+(index+1));button.disabled=offset!==0&&(index+offset<0||index+offset>=config.testCases.length);button.onclick=()=>{if(offset)move(index,index+offset);else{config=collect();config.testCases.splice(index,1);draw();}};header.append(button);}
  const identity=document.createElement('div');identity.className='case-identity';
  const actions=document.createElement('div');actions.className='case-actions';
  identity.append(handle,label);
  for(const button of [...header.querySelectorAll('button')])actions.append(button);
  row.append(identity);
  const dataCell=document.createElement('div');dataCell.className='case-data';
  row.append(dataCell,actions);
  const schema=schemas[entry.case.id];
  if(schema){
    entry.case.additionalData=normalizeAdditionalData(schema,entry.case.additionalData??{},{validate:false});
    const fields=document.createElement('div');fields.className='additional';
    const render=()=>renderSchemaForm(fields,schema,entry.case.additionalData,next=>{entry.case.additionalData=next;render();},webLocalized);
    render();dataCell.append(fields);
  }else if(entry.case.additionalData!==undefined){const fields=additionalFields(entry.case.additionalData,entry.case,'additionalData',webLocalized.additionalData);fields.className='additional';dataCell.append(fields);}

 });
}

let selectedCaseIndex=null;

   $('caseSearch').focus();
   closeCasePicker();
   $('caseSearchStatus').textContent=webLocalized.selectedCase+item.name;
  };
  option.onkeydown=event=>{
   if(event.key==='ArrowDown'){event.preventDefault();option.nextElementSibling?.focus();}
   if(event.key==='ArrowUp'){event.preventDefault();if(option.previousElementSibling)option.previousElementSibling.focus();else $('caseSearch').focus();}
   if(event.key==='Escape'){event.preventDefault();$('caseSearch').focus();closeCasePicker();}
  };
  list.append(option);
 });
 const count=list.children.length;
 list.hidden=!show||count===0;
 $('caseSearch').setAttribute('aria-expanded',String(!list.hidden));
 $('add').disabled=selectedCaseIndex===null;
 $('caseSearchStatus').textContent=count ? webLocalized.searchCount.replace('{count}',count) : webLocalized.noMatchingCases;
}
$('caseSearch').oninput=()=>{selectedCaseIndex=null;filterCases(true);};
$('caseSearch').onfocus=()=>filterCases(true);
$('caseSearch').onclick=()=>filterCases(true);
$('caseSearch').onkeydown=event=>{
 if(event.key==='ArrowDown'){event.preventDefault();filterCases(true);$('casePicker').firstElementChild?.focus();}

document.addEventListener('click',event=>{if(!event.target.closest('.case-combo'))closeCasePicker();});

 if(!event.currentTarget.contains(event.relatedTarget))closeCasePicker();

function collectDevice(){if(!devicePlatform)return;const prior=deviceDrafts[devicePlatform];const app={...prior.app,source:$('appSource').value};const identity=devicePlatform==='iOS'?'bundleId':'appPackage';app[identity]=$('appIdentity').value.trim();if(app.source==='file')app.path=$('appPath').value.trim();else delete app.path;if(devicePlatform==='Android'&&$('appActivity').value.trim())app.appActivity=$('appActivity').value.trim();else delete app.appActivity;deviceDrafts[devicePlatform]={...prior,profileName:$('profileName').value.trim(),device:{...prior.device,type:$('deviceType').value,id:$('deviceId').value.trim()},app};}
function deviceVisibility(){$('appPathLabel').hidden=$('appSource').value!=='file';$('activityLabel').hidden=devicePlatform!=='Android';}
async function loadDevice(platform){collectDevice();const version=++deviceRequest;deviceLoading=true;devicePlatform=null;controls();try{const data=deviceDrafts[platform]??(await api('device?platform='+encodeURIComponent(platform))).config;if(version!==deviceRequest)return;deviceDrafts[platform]=data;devicePlatform=platform;$('devicePlatform').textContent=platform;$('deviceType').replaceChildren();for(const type of [platform==='iOS'?'simulator':'emulator','real']){const option=document.createElement('option');option.value=type;option.textContent=type;$('deviceType').append(option);}$('profileName').value=data.profileName??'';$('deviceType').value=data.device?.type??'';$('deviceId').value=data.device?.id??'';$('appSource').value=data.app?.source??'installed';$('appPath').value=data.app?.path??'';$('appIdentity').value=data.app?.[platform==='iOS'?'bundleId':'appPackage']??'';$('appActivity').value=data.app?.appActivity??'';$('identityLabel').textContent=platform==='iOS'?webLocalized.bundleId:'App Package';deviceVisibility();}catch(error){notice(error.message);}finally{if(version===deviceRequest){deviceLoading=false;controls();}}}
async function saveDevice(){if(deviceLoading||!devicePlatform)throw Error(webLocalized.deviceLoading);collectDevice();notice((await api('device','POST',deviceDrafts[devicePlatform])).message);}
$('appSource').onchange=deviceVisibility;
document.querySelectorAll('input[name=platform]').forEach(input=>input.onchange=()=>{config=collect();loadDevice(input.value);});
async function resultBlob(file){const run=$('resultPicker').value;if(!run)throw Error(webLocalized.noResults);const response=await fetch('/api/results/file?run='+encodeURIComponent(run)+'&file='+encodeURIComponent(file),{headers:{'X-Dashboard-Token':token}});if(!response.ok){const detail=await response.json().catch(()=>({}));throw Error(detail.error==='Invalid result path'?webLocalized.restartDashboard:detail.error??(webLocalized.missingFile+file+webLocalized.inRun));}return response.blob();}
let reportRequest=0;
let videoUrl=null,videoRequest=0;
function clearVideos(){
 videoRequest++;
 const video=$('resultVideo');video.pause();video.removeAttribute('src');video.load();
 if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;
}
$('closeVideo').onclick=()=>$('videoDialog').close();
$('videoDialog').addEventListener('close',clearVideos);
async function openVideo(item){
 clearVideos();const request=videoRequest;
 $('videoTitle').textContent=webLocalized.caseNumber+item.executionIndex+' '+item.caseId;
 $('videoMessage').textContent=webLocalized.loadingVideo;
 $('videoDialog').showModal();
 try{
  const blob=await resultBlob('case-'+item.executionIndex+'.mp4');
  if(request!==videoRequest)return;
  videoUrl=URL.createObjectURL(blob);$('resultVideo').src=videoUrl;
  $('videoMessage').textContent='';
 }catch(error){if(request===videoRequest)$('videoMessage').textContent=error.message;}
}
$('resultVideo').onerror=()=>{if($('resultVideo').getAttribute('src'))$('videoMessage').textContent=webLocalized.videoUnsupported;};
function bindReportVideos(result){
 const doc=$('reportFrame').contentDocument;
 if(!doc)return;
 doc.documentElement.dataset.theme=document.documentElement.dataset.theme;
 for(const button of doc.querySelectorAll('[data-video-case]')){
  const item=(result.cases??[]).find(item=>String(item.executionIndex)===button.dataset.videoCase);
  if(item)button.onclick=()=>openVideo(item);
 }
}
window.addEventListener('pagehide',clearVideos);
function filterResults(){
 const query=$('resultSearch').value.trim().toLowerCase();
 const list=$('resultChoices');list.replaceChildren();
 for(const option of $('resultPicker').options){
  if(!option.textContent.toLowerCase().includes(query))continue;
  const button=document.createElement('button');button.type='button';button.textContent=option.textContent;
  button.onkeydown=event=>{
   if(event.key==='ArrowDown'){event.preventDefault();button.nextElementSibling?.focus();}
   if(event.key==='ArrowUp'){event.preventDefault();if(button.previousElementSibling)button.previousElementSibling.focus();else $('resultSearch').focus();}
   if(event.key==='Escape'){$('resultSearch').focus();list.hidden=true;}
  };
  button.onclick=()=>{$('resultPicker').value=option.value;$('resultSearch').value=option.textContent;list.hidden=true;showResult();};
  list.append(button);
 }
 if(!list.children.length)list.textContent=webLocalized.noMatchingResults;
 list.hidden=false;
}
$('resultSearch').oninput=filterResults;
$('resultSearch').onfocus=filterResults;
$('resultSearch').onkeydown=event=>{
 if(event.key==='Escape')$('resultChoices').hidden=true;
 if(event.key==='ArrowDown'){event.preventDefault();$('resultChoices').querySelector('button')?.focus();}
};
document.addEventListener('click',event=>{if(!event.target.closest('.result-combo'))$('resultChoices').hidden=true;});
document.querySelector('.result-combo').addEventListener('focusout',event=>{
 if(!event.currentTarget.contains(event.relatedTarget))$('resultChoices').hidden=true;
});
async function showResult(){const version=++reportRequest;clearVideos();if($('videoDialog').open)$('videoDialog').close();$('reportFrame').hidden=true;try{const [blob,resultBlobData]=await Promise.all([resultBlob('report.html'),resultBlob('result.json')]);const result=JSON.parse(await resultBlobData.text());const text=await blob.text();if(version!==reportRequest)return;const doc=new DOMParser().parseFromString(text,'text/html');doc.querySelectorAll('a').forEach(a=>a.remove());$('reportFrame').onload=()=>{if(version===reportRequest)bindReportVideos(result);};$('reportFrame').srcdoc=doc.documentElement.outerHTML;$('reportFrame').hidden=false;$('resultMessage').textContent=webLocalized.reportFromResults;}catch(error){if(version===reportRequest)$('resultMessage').textContent=error.message;}}
async function refreshResults({selectLatest=false}={}){try{const data=await api('results');const signature=JSON.stringify(data.results);if(signature===resultSignature&&!selectLatest)return;resultSignature=signature;const previous=$('resultPicker').value;$('resultPicker').replaceChildren();for(const result of data.results){const option=document.createElement('option');option.value=result.folder;option.textContent=result.folder+' — '+(webLocalized['status'+result.status]??result.status);$('resultPicker').append(option);}if(!selectLatest&&data.results.some(item=>item.folder===previous))$('resultPicker').value=previous;$('resultSearch').value=$('resultPicker').selectedOptions[0]?.textContent??'';$('resultChoices').hidden=true;await showResult();}catch(error){$('resultMessage').textContent=error.message;}}
$('resultPicker').onchange=showResult;$('refreshResults').onclick=()=>{resultSignature='';refreshResults();};
for(const [id,file]of [['downloadExcel','report.xlsx'],['downloadJson','result.json']])$(id).onclick=async()=>{try{const url=URL.createObjectURL(await resultBlob(file));const link=document.createElement('a');link.href=url;link.download=$('resultPicker').value+'_'+file;link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}catch(error){$('resultMessage').textContent=error.message;}};
async function poll(){if(polling)return;polling=true;try{const data=await api('status');connected=true;appiumState=data.appium;ready=data.appium==='ready';const wasRunning=running;running=data.run.status==='running';if(wasRunning&&!running)refreshResults({selectLatest:true});$('appiumStatus').textContent=({ready:webLocalized.ready,offline:webLocalized.offline,starting:webLocalized.starting,unavailable:webLocalized.unavailable,stopping:webLocalized.stopping})[data.appium];$('appiumStatus').className='badge '+data.appium;$('runStatus').textContent=({idle:webLocalized.idle,running:webLocalized.running,STOPPED:webLocalized.stopped})[data.run.status]??webLocalized['status'+data.run.status]??data.run.status;$('runStatus').className='badge '+data.run.status;for(const kind of ['run','appium']){const el=$(kind+'Log');if(data.logs[kind]&&el.textContent!==data.logs[kind]){const bottom=el.scrollTop+el.clientHeight>=el.scrollHeight-30;el.textContent=data.logs[kind];if(bottom)el.scrollTop=el.scrollHeight;}}}catch(error){connected=false;ready=false;$('appiumStatus').textContent=webLocalized.disconnected;$('appiumStatus').className='badge ERROR';notice(webLocalized.reconnect+error.message+')');}finally{polling=false;controls();}}
poll();setInterval(poll,2000);
(async()=>{try{const data=await api('config');config={...data.config,runName:'',shouldContinueNextCaseWhenFail:true};catalog=data.cases;schemas=data.schemas??{};filterCases();draw();loaded=true;await loadDevice(config.platform);await refreshResults();}catch(error){notice(error.message);}controls();})();
